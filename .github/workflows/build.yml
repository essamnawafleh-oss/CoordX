name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tests
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pytest -q tests --junitxml=junit.xml

      - name: Report test failures
        if: failure()
        shell: pwsh
        run: python tests/junit_to_annotations.py junit.xml

      - name: Build exe
        shell: pwsh
        run: ./build.ps1

      - name: Smoke test (bundled OCR models present)
        shell: pwsh
        run: |
          if (-not (Test-Path dist\CoordX\CoordX.exe)) { throw "exe missing" }
          $m = Get-ChildItem -Recurse dist\CoordX -Filter *.onnx
          if ($m.Count -lt 3) { throw "OCR models missing from bundle" }
          python tests\make_sample.py $env:RUNNER_TEMP
          foreach ($f in @("sample.png", "sample.pdf")) {
            $rep = Join-Path $env:RUNNER_TEMP "$f.txt"
            Start-Process -Wait -FilePath dist\CoordX\CoordX.exe -ArgumentList "--selftest", (Join-Path $env:RUNNER_TEMP $f), $rep
            Get-Content $rep
            if (-not (Select-String -Path $rep -Pattern "6 points")) { throw "selftest failed for $f" }
          }

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path coordx\__init__.py -Pattern '"(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Installer
        shell: pwsh
        env:
          COORDX_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc installer.iss

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist\CoordX -DestinationPath "Output\CoordX-Portable-${{ steps.ver.outputs.version }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: CoordX-${{ steps.ver.outputs.version }}
          path: Output/*

      - name: Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: Output/*
